/*
 * Layout concept: grid-paper backdrop, one centred phone-width column with the 4:5 video as the hero.
 * On wide screens a step list sits to the left. Help and FAQs open as tan paper sheets.
 * The finish screen flips the whole page to yellow.
 */
:root {
  color-scheme: dark;

  --maroon: #3F072F;
  --tan: #FFF7F2;
  --peach: #FF7557;
  --yellow: #FCCE00;
  --violet: #C2ABFF;
  --green: #2EA66B;
  --blue: #408FED;
  --red: #FF4A38;
  --black: #000000;

  --bg: var(--maroon);
  --fg: var(--tan);
  --dim: rgba(255, 247, 242, .68);
  --faint: rgba(255, 247, 242, .16);
  --grid: rgba(255, 247, 242, .07);
  --accent: var(--peach);
  --on-accent: var(--maroon);
  --signal: var(--yellow);
  --on-signal: var(--black);
  --dot-off: rgba(194, 171, 255, .38);

  --paper: var(--tan);
  --ink: var(--black);
  --ink-dim: rgba(0, 0, 0, .62);
  --ink-line: rgba(0, 0, 0, .14);

  --f-display: 'Louize', Georgia, 'Times New Roman', serif;
  --f-punch: 'Sproos Sans', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Athletics', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --col: 460px;
  --tap: 56px;

  /* The video is 4:5. Its height is capped so the Next button stays on screen. */
  --vcap: min(62dvh, max(230px, calc(100dvh - 420px)));
  --vw: min(100%, calc(var(--vcap) * .8));
}

@media (min-width: 980px) {
  :root { --vcap: min(560px, max(260px, calc(100dvh - 450px))); }
}

body[data-view="done"] {
  --bg: var(--yellow);
  --fg: var(--black);
  --dim: rgba(0, 0, 0, .68);
  --faint: rgba(0, 0, 0, .18);
  --grid: rgba(0, 0, 0, .06);
  --accent: var(--black);
  --on-accent: var(--tan);
  --signal: var(--black);
  --on-signal: var(--tan);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; overflow-x: clip; }

body {
  margin: 0;
  min-height: 100%;
  padding-block: 10px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
  background-size: 44px 44px;
  background-position: center top;
  color: var(--fg);
  font: 500 16px/1.45 var(--f-body);
  transition: background-color .35s ease, color .35s ease;
}

body { overflow-x: clip; }
body.lock { overflow: hidden; }

h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
svg { display: block; }

:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
body[data-view="done"] :focus-visible { outline-color: var(--black); }

.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Shell ---------- */
.shell {
  display: grid;
  grid-template-columns: minmax(0, var(--col));
  justify-content: center;
  gap: 40px;
}

.col {
  min-width: 0; display: flex; flex-direction: column; align-items: stretch;
  min-height: calc(100dvh - 34px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}

.rail { display: none; }

@media (min-width: 980px) {
  .shell { grid-template-columns: 280px minmax(0, var(--col)); gap: 64px; padding-top: 18px; }
  .rail { display: block; position: sticky; top: 28px; align-self: start; padding-top: 86px; }
  .topbar__steps { display: none; }
  .shell--solo { grid-template-columns: minmax(0, 680px); gap: 0; }
}

/* ---------- Top bar ---------- */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: 56px;
}
.topbar > :first-child { justify-self: start; }
.topbar > :last-child { justify-self: end; }

.logo-link { display: block; color: var(--accent); padding: 8px 12px; border-radius: 10px; }
body[data-view="done"] .logo-link { color: var(--black); }
.logo { height: 34px; width: auto; }
.logo path { fill: currentColor; }

.topbar__steps {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 14px;
  background: transparent; border: 1.5px solid var(--faint); border-radius: 999px;
  font-size: 15px;
}
.topbar__steps svg { width: 18px; height: 18px; }

.topbar__back {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px 0 4px; white-space: nowrap;
  background: none; border: 0; font-size: 15px; color: var(--dim);
}

/* ---------- Progress dots ---------- */
.dots {
  list-style: none; margin: 6px 0 0; padding: 0 2px;
  display: flex; align-items: center;
}
.dots li { display: flex; align-items: center; flex: 1 1 0; min-width: 0; }
.dots li:last-child { flex: 0 0 auto; }
.dot {
  position: relative; flex: none;
  width: var(--hit, 30px); height: var(--hit, 30px); padding: 0; border: 0; background: none;
  display: grid; place-items: center;
}
.dot::before {
  content: ""; width: var(--dv, 15px); height: var(--dv, 15px); border-radius: 50%;
  background: var(--dot-off); transition: background .2s, transform .2s;
}
body[data-view="done"] .dot::before { background: var(--black); }
.dot.is-done::before, .dot.is-now::before { background: var(--signal); }
.dot.is-now::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--signal);
}
.dot.is-now::before { transform: scale(.82); }
.dots .link {
  flex: 1 1 auto; min-width: 4px; height: 0; margin: 0 1px;
  border-top: 3px dotted var(--dot-off);
}
.dots .link.is-done { border-top-color: var(--signal); }

/* ---------- Title ---------- */
.dots, .eyebrow, .title { width: var(--vw); min-width: min(100%, 300px); margin-inline: auto; }
.eyebrow { margin-top: 20px; font-size: 14px; color: var(--dim); letter-spacing: .01em; text-align: center; }
.title, .home__h, .done__h, .moment__h { outline: none; }
.title {
  margin-top: 6px;
  font: 400 clamp(28px, 7.4vw, 36px)/1.08 var(--f-display);
  text-wrap: balance;
  text-align: center;
  outline: none;
}
.title em {
  font: normal 400 .9em/1 var(--f-punch);
  letter-spacing: -.035em;
  color: var(--accent);
}

/* ---------- Video ---------- */
.stagewrap { margin-top: 18px; }
.video {
  position: relative;
  aspect-ratio: 4 / 5;
  width: var(--vw);
  margin-inline: auto;
  border-radius: 22px;
  overflow: hidden;
  background: var(--bg);
  box-shadow: 0 0 0 1.5px var(--faint);
}
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.vph {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 24px; text-align: center;
  background:
    radial-gradient(circle at 50% 38%, rgba(255, 117, 87, .22), transparent 62%),
    var(--bg);
}
.vph__n {
  font: 400 clamp(110px, 38vw, 170px)/.8 var(--f-punch);
  letter-spacing: -.06em; color: var(--signal);
}
.vph__play {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
}
.vph__play svg { width: 26px; height: 26px; margin-left: 3px; }
.vph__t { font: 400 20px/1.2 var(--f-display); }
.vph__s { font-size: 13px; color: var(--dim); }

.video__err {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 28px; text-align: center; background: var(--bg);
}
.video__err p { font: 400 22px/1.2 var(--f-display); }
.video__err a { color: var(--accent); }

.callout {
  margin: 16px auto 0; width: var(--vw);
  padding: 16px 18px; border: 2px solid var(--signal); border-radius: 18px; min-width: min(100%, 300px);
}
.callout h2 { font: 400 20px/1.2 var(--f-display); color: var(--signal); }
.callout p { margin-top: 6px; color: var(--fg); }
.callout--caution { border-color: var(--red); }
.callout--caution h2 { color: var(--red); }

.steplink { margin-top: 14px; text-align: center; font-size: 15px; }
.steplink a { color: var(--accent); text-underline-offset: 4px; }

.video__why { font-size: 15px; color: var(--dim); max-width: 30ch; }
.video__err p.video__why { font: 500 15px/1.4 var(--f-body); }

/* ---------- Pager ---------- */
.pager {
  margin: 18px auto 0; width: var(--vw);
  min-width: min(100%, 300px);
  display: flex; gap: 12px;
}
.round {
  flex: none; width: var(--tap); height: var(--tap); border-radius: 50%;
  display: grid; place-items: center;
  background: transparent; border: 2px solid var(--faint); color: var(--fg);
  transition: transform .15s, border-color .15s;
}
.round:hover:not([aria-disabled="true"]) { border-color: var(--fg); }
.round[aria-disabled="true"] { opacity: .35; cursor: default; }
.round svg { width: 24px; height: 24px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: var(--tap); padding: 0 26px; border-radius: 999px; border: 2px solid transparent;
  font-size: 18px; text-decoration: none; text-align: center;
  transition: transform .15s, background-color .15s, border-color .15s;
}
.btn:active, .round:active:not([aria-disabled="true"]) { transform: scale(.97); }

    var callout = s.callout
      ? '<aside class="callout' + (s.callout.kind === 'caution' ? ' callout--caution' : '') + '"><h2>' + esc(s.callout.title) +
        '</h2><p>' + esc(s.callout.body) + '</p></aside>' : '';
    var link = s.link
      ? '<p class="steplink"><a href="' + esc(s.link.url) + '" target="_blank" rel="noopener">' + esc(s.link.label) + '</a></p>' : '';
    var label = isMulti(steps) && s.section ? s.section : g.name;
    var hints = rel.length
      ? '<section class="hints"><p class="hints__t">Common questions on this step</p><div class="chips">' +
        rel.map(function (f) { return '<button class="chip" data-act="faq" data-id="' + f.id + '">' + esc(f.q) + '</button>'; }).join('') +
        '</div></section>' : '';
    return '<div class="shell"><aside class="rail" aria-label="All steps">' + stepListHTML(g, steps, i) + '</aside>' +
      '<main class="col">' + topbar('step') + dotsHTML(steps, i) +
      '<div class="swap ' + (state.dir < 0 ? 'enter enter--back' : 'enter') + '">' +
      '<p class="eyebrow">Step ' + (i + 1) + ' of ' + n + ' · ' + esc(label) + '</p>' +
      '<h1 class="title" tabindex="-1" data-focus>' + titleHTML(s) + '</h1>' +
      '<div class="stagewrap">' + videoHTML(s) + '</div>' + link + '</div>' +
      '<nav class="pager" aria-label="Step navigation">' +
      '<button class="btn btn--back" data-act="back" aria-label="' + (i === 0 ? 'Back to all guides' : 'Previous step') + '">' + ico.left + 'Back</button>' +
      '<button class="btn btn--next" data-act="next">' + (last ? 'Finish' + ico.check : 'Next step' + ico.right) + '</button></nav>' +
      callout + hints + footer() + dockHTML() + '</main></div>';
  }

  // Help tools stay on screen so nobody has to scroll to find them.
  function dockHTML() {
    return '<div class="dockwrap"><div class="dock" role="group" aria-label="Help">' +
      '<button class="dockbtn dockbtn--faq" data-act="faq">FAQs</button>' +
      '<button class="dockbtn dockbtn--help" data-act="help">' + ico.chat + '<span>Get help</span></button>' +
      '<button class="dockbtn dockbtn--moment" data-act="moment"><i class="mini" aria-hidden="true"></i><span>I need a moment…</span></button>' +
      '</div></div>';
  }

  function doneView() {
    var g = cur(), steps = stepsOf(g), n = steps.length, sprays = faqsFor(['sprays'])[0];
    var out = '';
    if (state.outcome === 'smooth') {
      out = '<section class="panel" id="outcome"><h2>Glad it went well.</h2>' +
        '<p>A quick review helps the next person feel ready to pick up a screwdriver.</p>' +
        '<a class="btn btn--peach btn--block" data-act="review" href="' + esc(C.review.url) + '" target="_blank" rel="noopener">Leave a review</a>' +
        '<p style="margin-top:22px">Show off your work. Tag us ' + esc(C.social.handle) + '.</p>' +
        '<p class="caption" id="caption">' + esc(C.social.caption) + '</p>' +
        '<div class="row"><button class="btn btn--ghost btn--block" data-act="copy">Copy caption</button></div></section>';
    } else if (state.outcome === 'snag') {
      out = '<section class="panel" id="outcome"><h2>Let’s sort it out.</h2>' +
        '<p>Tell us what’s happening and we’ll help you get it working.</p>' +
        '<div class="row"><button class="btn btn--peach btn--block" data-act="help">' + ico.chat + 'Chat with us</button>' +
        '<button class="btn btn--ghost btn--block" data-act="faq">Browse FAQs</button></div></section>';
    }
    var next = '';
    if (g.after && g.after.length) {
      next = '<section class="menu__sec next"><h2 class="menu__h">Add to your <em>shower</em></h2><p class="menu__sub">Accessories slide onto your bar.</p><ul class="tiles tiles--3">' +
        g.after.map(function (sl) { var a = guideBy(sl); return a ? tileHTML(a, true) : ''; }).join('') + '</ul></section>';
    }
    var filter = g.filter
      ? '<section class="tipcard"><h2>Your filter lasts about 3 months</h2><p>Swapping it takes about 2 minutes.</p>' +
        '<p><a data-act="refill" href="' + esc(C.refill.url) + '" target="_blank" rel="noopener">Get a replacement filter</a></p></section>' : '';
    var tip = sprays && g.tip === 'shower'
      ? '<section class="tipcard"><h2>Change the spray</h2><p>' + esc(sprays.a[0]) + '</p></section>' : '';
    return '<div class="shell shell--solo"><main class="col">' + topbar('done') +
      '<section class="done__hero"><div class="confetti" aria-hidden="true"></div>' + mark('done__mark') +
      '<h1 class="done__h" tabindex="-1" data-focus>You did it <em>yourself</em>.</h1>' +
      '<p class="done__p">Go take that first shower.</p></section>' +
      '<section class="ask"><h2 class="ask__q">How did it go?</h2><div class="ask__row">' +
      '<button class="btn btn--pick" data-act="outcome" data-v="smooth" aria-pressed="' + (state.outcome === 'smooth') + '">Smooth</button>' +
      '<button class="btn btn--pick" data-act="outcome" data-v="snag" aria-pressed="' + (state.outcome === 'snag') + '">Hit a snag</button></div></section>' +
      out + filter + tip + next +
      '<div class="done__nav"><button data-act="goto" data-i="' + (n - 1) + '">Back to step ' + n + '</button>' +
      '<button data-act="goto" data-i="0">Watch again</button><button data-act="help">Get help</button>' +
      '<button data-act="home">All guides</button></div>' +
      footer() + '</main></div>';
  }

  /* ---------- render ---------- */
  function render(focus) {
    document.body.dataset.view = state.view;
    app.innerHTML = state.view === 'home' ? homeView() : state.view === 'intro' ? introView() : state.view === 'step' ? stepView() : doneView();
    window.scrollTo(0, 0);
    var h = app.querySelector('[data-focus]');
    if (focus && h) { try { h.focus({ preventScroll: true }); } catch (e) { /* older browsers */ } }
    afterRender();
  }

  var vimeoQ = null;
  function withVimeo(cb) {
    if (window.Vimeo) return cb();
    if (vimeoQ) { vimeoQ.push(cb); return; }
    vimeoQ = [cb];
    var sc = document.createElement('script');
    sc.src = 'https://player.vimeo.com/api/player.js';
    sc.onload = function () { var q = vimeoQ; vimeoQ = null; q.forEach(function (f) { f(); }); };
    sc.onerror = function () { vimeoQ = null; };
    document.head.appendChild(sc);
  }

  function afterRender() {
    var live = document.getElementById('live');
    if (state.view === 'step') {
      var g = cur(), steps = stepsOf(g), s = steps[state.i];
      saveProg(g.slug, state.i);
      if (live) live.textContent = 'Step ' + (state.i + 1) + ' of ' + steps.length + ': ' + s.title;
      track('install_step_view', { guide: g.slug, step_id: s.id, step_number: state.i + 1, step_count: steps.length });
      var f = app.querySelector('iframe[data-vimeo]'), errEl = app.querySelector('.video__err');
      if (f && errEl && C.mode === 'vimeo') {
        withVimeo(function () {
          try {
            var p = new window.Vimeo.Player(f), timer = null;
            var showErr = function (why) {
              if (!document.contains(errEl)) return;
              var code = errEl.querySelector('.video__code');
              if (code && why) code.textContent = why;
              errEl.hidden = false;
              track('install_video_error', { guide: g.slug, step_id: s.id, why: why || '' });
            };
            // If the player never reports ready (blocked embed, no network), say so instead of leaving a blank box.
            timer = setTimeout(function () { showErr('No reply from the Vimeo player after 12 seconds.'); }, 12000);
            p.ready().then(function () { clearTimeout(timer); errEl.hidden = true; });
            p.on('play', function () { track('install_video_play', { guide: g.slug, step_id: s.id }); });
            p.on('error', function (e) {
              clearTimeout(timer);
              showErr('Vimeo says: ' + ((e && (e.name || e.message)) || 'unknown error') + (e && e.name && e.message ? ' – ' + e.message : ''));
            });
          } catch (e) { /* the iframe still plays without the API */ }
        });
      } else if (f && errEl) {
        /* placeholder builds have no player */
      }
    } else if (state.view === 'intro') {
      var ig = cur();
      if (live) live.textContent = ig.name + ' install guide. ' + ig.steps.length + ' steps.';
      track('install_intro_view', { guide: ig.slug });
    } else if (state.view === 'done') {
      var dg = cur();
      saveProg(dg.slug, dg.steps.length);
      if (live) live.textContent = 'You finished the ' + dg.name + ' guide.';
      track('install_complete', { guide: dg.slug });
      burst();
    } else if (live) {
      live.textContent = 'sproos! install guides';
    }
  }

  function burst() {
    var box = app.querySelector('.confetti');
    if (!box || reduce) return;
    var cols = ['#FF7557', '#FF4A38', '#C2ABFF', '#2EA66B', '#408FED', '#7369E8', '#CF78D6', '#000000'], html = '';
    for (var k = 0; k < 38; k++) {
      var a = Math.random() * Math.PI * 2, d = 110 + Math.random() * 190;
      html += '<i style="--dx:' + Math.round(Math.cos(a) * d * 1.25) + 'px;--dy:' + Math.round(Math.sin(a) * d - 40) + 'px;--r:' +
        Math.round(Math.random() * 360) + 'deg;--s:' + (8 + Math.round(Math.random() * 12)) + 'px;--c:' + cols[k % cols.length] +
        ';animation-delay:' + (Math.random() * .18).toFixed(2) + 's"></i>';
    }
    box.innerHTML = html;
  }

  /* ---------- sheets ---------- */
  function openSheet(inner, kind) {
    closeSheet(true);
    sheetReturn = document.activeElement;
    var root = document.createElement('div');
    if (kind === 'moment') {
      root.className = 'moment-root';
      root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-labelledby', 'sheet-h');
      root.innerHTML = inner;
    } else {
      root.className = 'sheet-root';
      root.innerHTML = '<div class="sheet-back" data-act="close"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">' + inner + '</div>';
    }
    document.body.appendChild(root);
    document.body.classList.add('lock');
    sheet = root;
    var f = root.querySelector('[data-autofocus]') || root.querySelector('button, a[href], summary');
    if (f) f.focus({ preventScroll: true });
  }
  function closeSheet(silent) {
    if (!sheet) return;
    sheet.remove(); sheet = null;
    document.body.classList.remove('lock');
    if (!silent && sheetReturn && document.contains(sheetReturn)) { try { sheetReturn.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
    sheetReturn = null;
  }
  function sheetTop(h) {
    return '<div class="sheet__top"><h2 class="sheet__h" id="sheet-h">' + h + '</h2>' +
      '<button class="sheet__x" data-act="close" data-autofocus aria-label="Close">' + ico.close + '</button></div>';
  }

  function openSteps() {
    var g = cur(), steps = stepsOf(g);
    openSheet(sheetTop('All <em>steps</em>') + '<div style="margin-top:18px">' + stepListHTML(g, steps, state.i) + '</div>');
    var h = sheet.querySelector('.steplist__h'); if (h) h.remove();
  }

  function openFaq(openId) {
    var g = cur(), hot = [];
    if (state.view === 'step') hot = faqsFor(stepsOf(g)[state.i].faq);
    var hotIds = hot.map(function (f) { return f.id; });
    function item(f) {
      return '<details class="faq" id="faq-' + f.id + '"' + (f.id === openId ? ' open' : '') + '><summary>' + esc(f.q) + '</summary>' +
        '<div class="faq__a">' + f.a.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></details>';
    }
    var html = sheetTop('<em>FAQs</em>');
    if (hot.length) html += '<div class="faqgroup"><p class="faqgroup__h">On this step</p>' + hot.map(item).join('') + '</div>';
    D.faqGroups.forEach(function (grp) {
      if (grp.needs && !g[grp.needs]) return;
      if (g.hideFaq && g.hideFaq.indexOf(grp.id) > -1) return;
      var items = D.faqs.filter(function (f) { return f.group === grp.id && hotIds.indexOf(f.id) < 0; });
      if (items.length) html += '<div class="faqgroup"><p class="faqgroup__h">' + esc(grp.title) + '</p>' + items.map(item).join('') + '</div>';
    });
    openSheet(html);
    track('install_faq_open', { guide: g.slug, faq: openId || null });
    if (openId) { var el = sheet.querySelector('#faq-' + openId); if (el) el.scrollIntoView({ block: 'nearest' }); }
  }

  function contextLine() {
    var g = cur();
    if (!g) return 'What can we help with?';
    if (state.view === 'step') {
      var steps = stepsOf(g);
      return 'Hi! Looks like you’re on step ' + (state.i + 1) + ' of ' + steps.length + ' of the ' + g.name +
        ' install: ' + steps[state.i].title.replace(/\.$/, '') + '. What’s going on?';
    }
    return 'Hi! You finished the ' + g.name + ' install. Anything we can help with?';
  }

  function openHelp() {
    var g = cur();
    openSheet(sheetTop('We’re <em>moments</em> away.') +
      '<p class="sheet__lede">Stuck on a step or something looks off? Our team can help with your install.</p>' +
      '<div class="helpbtn"><button class="btn" data-act="chat">' + ico.chat + 'Chat with us</button>' +
      '<button class="btn btn--soft" data-act="faq">Browse FAQs</button></div>' +
      (C.help.replyNote ? '<p class="helpnote">' + esc(C.help.replyNote) + '</p>' : '') +
      '<div class="mock" id="mock" hidden><div class="mock__bar"><span>sproos! support</span><span class="mock__tag">Prototype stand-in</span></div>' +
      '<div class="mock__body"><div class="bubble">' + esc(contextLine()) + '</div></div>' +
      '<div class="mock__in">Type a message…</div></div>' +
      '<p class="helpnote" id="mocknote" hidden>On the live site this button opens your Gorgias chat, with this step passed along.</p>');
    track('install_help_open', { guide: g ? g.slug : null, view: state.view, step_number: state.view === 'step' ? state.i + 1 : null });
  }

  function chat() {
    var G = window.GorgiasChat;
    if (G && typeof G.open === 'function') {
      closeSheet(true);
      G.open();
      track('install_chat_open', { guide: state.slug });
      return;
    }
    var m = document.getElementById('mock'), n = document.getElementById('mocknote');
    if (m) m.hidden = false;
    if (n) n.hidden = false;
    var b = sheet && sheet.querySelector('[data-act="chat"]'); if (b) b.hidden = true;
    if (m) m.scrollIntoView({ block: 'nearest' });
  }

  function openMoment() {
    openSheet('<div class="breath" aria-hidden="true"><div class="breath__blob"></div><div class="breath__txt"><span>Breathe in</span><span>Breathe out</span></div></div>' +
      '<h2 class="moment__h" id="sheet-h" tabindex="-1">Hey. You’ve <em>got</em> this.</h2>' +
      '<p class="moment__p">DIY can be hard sometimes. Take a breath. If you’d rather have a hand, we’re moments away.</p>' +
      '<div class="moment__btns"><button class="btn btn--next" data-act="close" data-autofocus>Let’s do this</button>' +
      '<button class="btn btn--ghost" data-act="help">' + ico.chat + 'Talk to us</button></div>', 'moment');
    track('install_moment_open', { guide: state.slug, step_number: state.view === 'step' ? state.i + 1 : null });
  }

  function toast(msg) {
    var old = document.getElementById('toast'); if (old) old.remove();
    var t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 2400);
  }

  function copyCaption() {
    var text = C.social.caption;
    function fallback() {
      var el = document.getElementById('caption');
      if (el && window.getSelection) {
        var r = document.createRange(); r.selectNodeContents(el);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      toast('Caption selected. Press and hold to copy.');
    }
    try {
      navigator.clipboard.writeText(text).then(function () { toast('Caption copied'); track('install_share_copy', { guide: state.slug }); }, fallback);
    } catch (e) { fallback(); }
  }

  /* ---------- events ---------- */
  // A photo that fails to load is dropped, leaving the brand-colour tile behind it.
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.closest('.photo')) t.remove();
  }, true);

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.dataset.act, g = cur(), n = g ? g.steps.length : 0;
    if (t.tagName === 'A' && act !== 'review' && act !== 'refill') e.preventDefault();
    switch (act) {
      case 'intro': go({ view: 'intro', slug: t.dataset.slug }); break;
      case 'start': go({ view: 'step', slug: state.slug, i: 0 }, { autoplay: true }); break;
      case 'resume': go({ view: 'step', slug: state.slug, i: +t.dataset.i || 0 }, { autoplay: true }); break;
      case 'home': go({ view: 'home' }); break;
      case 'goto': {
        var k = +t.dataset.i;
        if (state.view === 'step' && k === state.i) { closeSheet(true); break; }
        go({ view: 'step', slug: state.slug, i: k }, { dir: state.view === 'step' && k < state.i ? -1 : 1, autoplay: true });
        break;
      }
      case 'next':
        if (state.i < n - 1) go({ view: 'step', slug: state.slug, i: state.i + 1 }, { dir: 1, autoplay: true });
        else go({ view: 'done', slug: state.slug });
        break;
      case 'back':
        if (state.i > 0) go({ view: 'step', slug: state.slug, i: state.i - 1 }, { dir: -1, autoplay: true });
        else go({ view: 'intro', slug: state.slug }, { dir: -1 });
        break;
      case 'steps': openSteps(); break;
      case 'faq': openFaq(t.dataset.id || null); break;
      case 'help': openHelp(); break;
      case 'chat': chat(); break;
      case 'moment': openMoment(); break;
      case 'close': closeSheet(); break;
      case 'copy': copyCaption(); break;
      case 'review': track('install_review_click', { guide: state.slug }); break;
      case 'refill': track('install_refill_click', { guide: state.slug }); break;
      case 'outcome':
        state.outcome = t.dataset.v;
        track('install_outcome', { guide: state.slug, outcome: state.outcome });
        var y = window.scrollY;
        app.innerHTML = doneView();
        window.scrollTo(0, y);
        var o = document.getElementById('outcome'); if (o) o.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
        break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (sheet) {
      if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
      if (e.key === 'Tab') {
        var f = [].filter.call(sheet.querySelectorAll('button, a[href], summary, [tabindex="0"]'), function (x) { return !x.hidden && x.offsetParent !== null; });
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (state.view !== 'step' || e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'IFRAME' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); var nx = app.querySelector('[data-act="next"]'); if (nx) nx.click(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); var bk = app.querySelector('[data-act="back"]'); if (bk) bk.click(); }
  });

  /* ---------- boot ---------- */
  (function () {
    var live = document.createElement('div');
    live.id = 'live'; live.className = 'sr'; live.setAttribute('aria-live', 'polite');
    document.body.appendChild(live);

    var first = parseHash();
    state.view = first.view; state.slug = first.slug || null; state.i = first.i || 0;

    if (C.syncHash) {
      lastHash = location.hash;
      window.addEventListener('hashchange', function () {
        if (location.hash === lastHash) return;
        lastHash = location.hash;
        var r = parseHash();
        state.dir = r.view === 'step' && state.view === 'step' && r.i < state.i ? -1 : 1;
        closeSheet(true);
        state.view = r.view; state.slug = r.slug || null; state.i = r.i || 0; state.autoplay = false; state.outcome = null;
        render(true);
      });
    }

    if (C.gtm && C.gtm.load) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
      var gs = document.createElement('script');
      gs.async = true; gs.src = 'https://www.googletagmanager.com/gtm.js?id=' + C.gtm.id;
      document.head.appendChild(gs);
    }

    render(false);
  })();
})();

</script>
</body>
</html>
